name: Deploy web version

# Builds dist-web/ and publishes it to GitHub Pages.
# One-time setup: repo ▸ Settings ▸ Pages ▸ Build and deployment ▸ Source = "GitHub Actions".

on:
  push:
    branches:
      - main
      - 'arena/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build static bundle
        run: node tools/build-web.mjs
      - name: Sanity check the bundle
        run: |
          test -f dist-web/index.html
          test -f dist-web/preset-recipes.json
          test -f dist-web/lua-export.js
          ! grep -q 'src="/' dist-web/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
